# Levanta Oracle XE 21c y crea automaticamente el usuario BIBLIO en XEPDB1.
#   docker compose up -d
#   docker logs -f oracle-biblio      (esperar "DATABASE IS READY TO USE!")
services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-biblio
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: admin            # contrasena de SYS y SYSTEM
      APP_USER: biblio                  # usuario/esquema del proyecto
      APP_USER_PASSWORD: biblio123
    volumes:
      - oracle_data:/opt/oracle/oradata # los datos sobreviven a "docker compose down"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  oracle_data:
